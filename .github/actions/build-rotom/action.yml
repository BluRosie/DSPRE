name: Build rotom
description: Build rotom's CLI, language server and nitroarc library from DSPRE's fork in Tools/rotom-src and copy them into a DSPRE Tools directory. macOS gets no nitroarc library.

inputs:
  output-directory:
    description: Repository-relative Tools directory that receives the rotom executables and nitroarc library.
    required: true

runs:
  using: composite
  steps:
    # Builds take the fork's dspre branch, where DSPRE's fixes land ahead of upstream.
    - name: Checkout rotom submodule
      shell: bash
      run: git submodule update --init --remote Tools/rotom-src

    # uxie builds nitroarc with make and gcc; on Windows that means MinGW and the GNU target, as rotom's own CI does.
    - name: Set up MinGW
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: base-devel mingw-w64-x86_64-gcc
        path-type: inherit

    - name: Build rotom (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      env:
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        set -euo pipefail
        echo "Building rotom $(git -C Tools/rotom-src rev-parse HEAD)"

        rustup target add x86_64-pc-windows-gnu
        cargo build --release --locked --workspace --target x86_64-pc-windows-gnu --manifest-path Tools/rotom-src/Cargo.toml

        built=Tools/rotom-src/target/x86_64-pc-windows-gnu/release
        mkdir -p "$OUTPUT_DIRECTORY"
        cp "$built/rotom.exe" "$built/rotom-lsp.exe" "$built/nitroarc_ffi.dll" "$OUTPUT_DIRECTORY/"

    - name: Build rotom (Linux and macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        set -euo pipefail
        echo "Building rotom $(git -C Tools/rotom-src rev-parse HEAD)"

        if [ "$RUNNER_OS" = "macOS" ]; then
          echo '#ifndef __ASSEMBLER__' > /tmp/fix_strchrnul.h
          echo '#include <string.h>' >> /tmp/fix_strchrnul.h
          echo '#define strchrnul nitroarc_strchrnul' >> /tmp/fix_strchrnul.h
          echo '#endif' >> /tmp/fix_strchrnul.h
          CFLAGS="-include /tmp/fix_strchrnul.h" cargo build --release --locked --workspace --manifest-path Tools/rotom-src/Cargo.toml
        else
          cargo build --release --locked --workspace --manifest-path Tools/rotom-src/Cargo.toml
        fi

        built=Tools/rotom-src/target/release
        mkdir -p "$OUTPUT_DIRECTORY"
        cp "$built/rotom" "$OUTPUT_DIRECTORY/"
        cp "$built/rotom-lsp" "$OUTPUT_DIRECTORY/"
        ls $built
        lib_file=$(find $built -name "libnitroarc_ffi.*" \( -name "*.dylib" -o -name "*.so" \) | head -n 1)
        cp "$lib_file" "$OUTPUT_DIRECTORY/"

        if [ "$RUNNER_OS" = "macOS" ]; then
          install_name_tool -add_rpath "@executable_path" "$OUTPUT_DIRECTORY/rotom"
        fi

        chmod +x "$OUTPUT_DIRECTORY/rotom" "$OUTPUT_DIRECTORY/rotom-lsp"

    - name: Check rotom version
      shell: bash
      env:
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "Windows" ]; then exe="$OUTPUT_DIRECTORY/rotom.exe"; else exe="$OUTPUT_DIRECTORY/rotom"; fi
        expected_version="rotom $(sed -n 's/^version = "\(.*\)"/\1/p' Tools/rotom-src/Cargo.toml | head -n 1)"
        actual_version="$("$exe" --version)"
        if [ "$actual_version" != "$expected_version" ]; then
          echo "Expected '$expected_version', got '$actual_version'" >&2
          exit 1
        fi
        echo "Built $actual_version"
